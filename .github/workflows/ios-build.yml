name: iOS Dev Client Build (unsigned, Debug)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show selected Xcode version
        run: xcodebuild -version

      - name: Generate native iOS project
        run: npx expo prebuild -p ios

      - name: Locate workspace and scheme
        id: xcode
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          xcodebuild -workspace "$WORKSPACE" -list
          SCHEME=$(node -e "console.log(require('./app.json').expo.name)")
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"

      - name: Build unsigned .xcarchive
        run: |
          xcodebuild archive \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package unsigned .ipa
        run: |
          APP_PATH=$(find build/App.xcarchive/Products/Applications -maxdepth 1 -iname "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found. Full tree under build/App.xcarchive:"
            find build/App.xcarchive 2>/dev/null
            exit 1
          fi
          echo "App bundle: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload VideoApp-unsigned.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoApp-unsigned-ipa
          path: VideoApp-unsigned.ipa
          retention-days: 14
