name: iOS Dev Client Build (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show selected Xcode version
        run: xcodebuild -version

      - name: Generate native iOS project
        run: npx expo prebuild -p ios

      - name: Locate workspace and scheme
        id: xcode
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          xcodebuild -workspace "$WORKSPACE" -list
          SCHEME=$(node -e "console.log(require('./app.json').expo.name)")
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            build

      - name: Package unsigned .ipa
        run: |
          APP_PATH=$(find build -iname "*.app" -not -path "*/Index.noindex/*" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found. Full tree under build/Build/Products:"
            find build/Build/Products 2>/dev/null
            echo "Full tree under build/Build:"
            find build/Build -maxdepth 3 2>/dev/null
            exit 1
          fi
          echo "App bundle: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r VideoApp-unsigned.ipa Payload

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoApp-unsigned-ipa
          path: VideoApp-unsigned.ipa
          retention-days: 14
