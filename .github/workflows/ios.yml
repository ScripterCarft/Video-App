name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Apple Videos
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Release builds skip #if DEBUG code, so compile Debug as well.
      - name: Build Debug for Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project AppleVideos.xcodeproj \
            -scheme AppleVideos \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee xcodebuild-simulator.log

      # Unit tests on an iPhone simulator with the newest iOS runtime, hosted in
      # the app. Lines starting with PROBE record measured behavior.
      - name: Run tests
        run: |
          set -o pipefail
          xcrun simctl list runtimes
          RUNTIME=$(xcrun simctl list runtimes available | grep -E '^iOS ' | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.[A-Za-z0-9.-]+')
          DEVICE=$(xcrun simctl list devices available | awk -v runtime="$(xcrun simctl list runtimes available | grep -E '^iOS ' | tail -1 | awk '{print $1" "$2}')" '
            /^-- / { section = $0; next }
            index(section, runtime) && /iPhone/ { match($0, /[0-9A-F-]{36}/); print substr($0, RSTART, RLENGTH); exit }')
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl create "Test iPhone" "iPhone 17" "$RUNTIME")
          fi
          echo "Runtime $RUNTIME, device $DEVICE"
          xcodebuild \
            -project AppleVideos.xcodeproj \
            -scheme AppleVideos \
            -configuration Debug \
            -destination "id=$DEVICE" \
            -derivedDataPath TestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test | tee xcodebuild-test.log

      - name: Report probe results
        if: always()
        run: |
          grep -h "PROBE" xcodebuild-test.log 2>/dev/null | sort -u | head -40 | sed 's/^/::notice::/' || true
          grep -hE "✘|error:|failed" xcodebuild-test.log 2>/dev/null | grep -v "^PROBE" | sort -u | head -20 | sed 's/^/::warning::/' || true

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project AppleVideos.xcodeproj \
            -scheme AppleVideos \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee xcodebuild-device.log

      # Surface compiler errors as annotations so they are visible without
      # downloading the full build log.
      - name: Report compiler errors
        if: failure()
        run: |
          grep -hE "error:" xcodebuild-simulator.log xcodebuild-test.log xcodebuild-device.log 2>/dev/null \
            | sort -u | head -20 | sed 's/^/::error::/' || true

      - name: Package unsigned IPA
        if: success()
        run: |
          mkdir -p Payload
          ditto \
            DeviceDerivedData/Build/Products/Release-iphoneos/Apple\ Videos.app \
            Payload/Apple\ Videos.app
          zip -qry AppleVideos-unsigned.ipa Payload

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppleVideos-iPhone
          path: |
            AppleVideos-unsigned.ipa
            xcodebuild-simulator.log
            xcodebuild-test.log
            xcodebuild-device.log
          if-no-files-found: warn
          retention-days: 14
