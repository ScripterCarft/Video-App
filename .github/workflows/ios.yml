name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# Two jobs in parallel: the IPA never waits for the tests. Both run on
# GitHub's Xcode 27 image (public preview, macOS 27, arm64): the deployment
# target is iOS 27, and only this image has its SDK and simulators
# (macos-26 stops at Xcode 26.6 with the iOS 26.5 SDK). Its default Xcode is
# the released version; betas installed beside it are not used.
jobs:
  build:
    name: Build IPA
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report Xcode
        run: |
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')%0AiOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project AppleVideos.xcodeproj \
            -scheme AppleVideos \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild-device.log

      # Compiler errors as annotations, readable without the full log.
      - name: Report compiler errors
        if: failure()
        run: |
          grep -hE "error:" xcodebuild-device.log 2>/dev/null \
            | sort -u | head -20 | sed 's/^/::error::/' || true

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          ditto \
            DerivedData/Build/Products/Release-iphoneos/Apple\ Videos.app \
            Payload/Apple\ Videos.app
          zip -qry AppleVideos-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AppleVideos-iPhone
          path: AppleVideos-unsigned.ipa
          retention-days: 14

  # Unit tests on an iPhone simulator, hosted in the app. The Debug build for
  # testing also checks the #if DEBUG code the Release build skips. Lines
  # starting with PROBE record measured behavior.
  test:
    name: Debug build and tests
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      # The first iPhone simulator of the newest iOS runtime, booted now so
      # it finishes starting while the app compiles.
      - name: Boot simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes available | grep -E '^iOS ' | tail -1 | awk '{print $1" "$2}')
          DEVICE=$(xcrun simctl list devices available | awk -v runtime="-- $RUNTIME --" '
            /^-- / { section = $0; next }
            section == runtime && /iPhone/ { match($0, /[0-9A-F-]{36}/); print substr($0, RSTART, RLENGTH); exit }')
          echo "SETUP runtime '$RUNTIME', device '$DEVICE'" | tee xcodebuild-test.log
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild \
            -project AppleVideos.xcodeproj \
            -scheme AppleVideos \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build-for-testing 2>&1 | tee xcodebuild-build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -hE "error:" xcodebuild-build.log 2>/dev/null \
            | sort -u | head -20 | sed 's/^/::error::/' || true

      # The suite takes seconds; limits keep a hang or crash loop short.
      - name: Run tests
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$DEVICE" -b >/dev/null
          xcodebuild \
            -project AppleVideos.xcodeproj \
            -scheme AppleVideos \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath DerivedData \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            test-without-building 2>&1 | tee -a xcodebuild-test.log

      - name: Report test results
        if: always()
        # GitHub shows ten annotations per step, so lines are grouped into
        # multi-line annotations (%0A is a line break there).
        run: |
          annotate() {
            lines=$(cat | head -"$2" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$lines" ] && echo "::$1::$lines" || true
          }
          grep -h "SETUP" xcodebuild-test.log 2>/dev/null | annotate notice 5
          grep -h "PROBE" xcodebuild-test.log 2>/dev/null | sort -u | annotate notice 40
          grep -hE "Test run with|Suite .* (passed|failed)|✘|Test .* (started|passed|failed)|timed out|Restarting|Could not cast" xcodebuild-test.log 2>/dev/null | annotate notice 60
          # The end of the log: where a stuck or crashed run stopped.
          tail -25 xcodebuild-test.log 2>/dev/null | annotate notice 25

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppleVideos-test-logs
          path: |
            xcodebuild-build.log
            xcodebuild-test.log
          if-no-files-found: warn
          retention-days: 14
