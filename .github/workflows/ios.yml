name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Apple Videos
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The image's default Xcode may be older than the newest one installed;
      # the app targets the newest iOS, so build with the newest Xcode.
      - name: Select newest Xcode
        run: |
          INSTALLED=$(ls -d /Applications/Xcode*.app | tr '\n' ' ')
          NEWEST=$(ls -d /Applications/Xcode_*.app | sed -E 's/.*Xcode_([0-9.]+).*/\1 &/' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 | cut -d' ' -f2)
          sudo xcode-select -s "$NEWEST"
          echo "::notice::Installed: $INSTALLED%0ASelected: $NEWEST%0A$(xcodebuild -version | tr '\n' ' ')%0AiOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Release builds skip #if DEBUG code, so compile Debug as well.
      - name: Build Debug for Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project AppleVideos.xcodeproj \
            -scheme AppleVideos \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee xcodebuild-simulator.log

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project AppleVideos.xcodeproj \
            -scheme AppleVideos \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee xcodebuild-device.log

      # Surface compiler errors as annotations so they are visible without
      # downloading the full build log.
      - name: Report compiler errors
        if: failure()
        run: |
          grep -hE "error:" xcodebuild-simulator.log xcodebuild-device.log 2>/dev/null \
            | sort -u | head -20 | sed 's/^/::error::/' || true

      - name: Package unsigned IPA
        if: success()
        run: |
          mkdir -p Payload
          ditto \
            DeviceDerivedData/Build/Products/Release-iphoneos/Apple\ Videos.app \
            Payload/Apple\ Videos.app
          zip -qry AppleVideos-unsigned.ipa Payload

      # Unit tests on an iPhone simulator, hosted in the app, after the IPA so
      # a failing test never withholds a build. They need a simulator runtime
      # for the deployment target, which only an Xcode with that SDK brings;
      # without one they are skipped with a notice. Lines starting with PROBE
      # record measured behavior.
      - name: Run tests
        if: success()
        run: |
          set -o pipefail
          TARGET_MAJOR=$(grep -A1 'deploymentTarget:' project.yml | grep -oE '[0-9]+' | head -1)
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          if [ "${SDK_VERSION%%.*}" -lt "$TARGET_MAJOR" ]; then
            echo "SETUP tests skipped: the newest Xcode here has the iOS $SDK_VERSION SDK, the app requires iOS $TARGET_MAJOR" | tee xcodebuild-test.log
            exit 0
          fi
          if ! xcrun simctl list runtimes available | grep -qE "^iOS ${SDK_VERSION%%.*}\."; then
            xcodebuild -downloadPlatform iOS 2>&1 | tail -5 | tee -a xcodebuild-test.log
          fi
          RUNTIME_LINE=$(xcrun simctl list runtimes available | grep -E "^iOS ${SDK_VERSION%%.*}\." | tail -1)
          RUNTIME=$(echo "$RUNTIME_LINE" | awk '{print $1" "$2}')
          RUNTIME_ID=$(echo "$RUNTIME_LINE" | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.[A-Za-z0-9.-]+')
          # Its first iPhone simulator, or a new one of the newest iPhone type.
          DEVICE=$(xcrun simctl list devices available | awk -v runtime="-- $RUNTIME --" '
            /^-- / { section = $0; next }
            section == runtime && /iPhone/ { match($0, /[0-9A-F-]{36}/); print substr($0, RSTART, RLENGTH); exit }')
          if [ -z "$DEVICE" ] && [ -n "$RUNTIME_ID" ]; then
            TYPE=$(xcrun simctl list devicetypes | grep -E '^iPhone' | tail -1 | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9.-]+')
            DEVICE=$(xcrun simctl create "Test iPhone" "$TYPE" "$RUNTIME_ID")
          fi
          echo "SETUP SDK $SDK_VERSION, runtime '$RUNTIME', device '$DEVICE'" | tee -a xcodebuild-test.log
          xcodebuild \
            -project AppleVideos.xcodeproj \
            -scheme AppleVideos \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath TestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            test 2>&1 | tee -a xcodebuild-test.log

      - name: Report test results
        if: always()
        # GitHub shows ten annotations per step, so lines are grouped into
        # multi-line annotations (%0A is a line break there).
        run: |
          annotate() {
            lines=$(cat | head -"$2" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$lines" ] && echo "::$1::$lines" || true
          }
          grep -hE "SETUP|Downloading|Download|Installed" xcodebuild-test.log 2>/dev/null | annotate notice 20
          grep -h "PROBE" xcodebuild-test.log 2>/dev/null | sort -u | annotate notice 40
          grep -hE "Test run with|Suite .* (passed|failed)|✘|Test .* (passed|failed)" xcodebuild-test.log 2>/dev/null | annotate notice 40
          grep -hiE "error|failed|unable" xcodebuild-test.log 2>/dev/null | grep -v PROBE | sort -u | annotate warning 30

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppleVideos-iPhone
          path: |
            AppleVideos-unsigned.ipa
            xcodebuild-simulator.log
            xcodebuild-test.log
            xcodebuild-device.log
          if-no-files-found: warn
          retention-days: 14
