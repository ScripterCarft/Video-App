name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Apple Videos
    # GitHub's Xcode 27 image (public preview, macOS 27, arm64): the
    # deployment target is iOS 27, and only this image has its SDK (macos-26
    # stops at Xcode 26.6 with the iOS 26.5 SDK). Its default Xcode is the
    # released version; betas installed beside it are not used.
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Report Xcode
        run: |
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')%0AiOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      # Release builds skip #if DEBUG code, so compile Debug as well.
      - name: Build Debug for Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project AppleVideos.xcodeproj \
            -scheme AppleVideos \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild-simulator.log

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project AppleVideos.xcodeproj \
            -scheme AppleVideos \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild-device.log

      # Compiler errors as annotations, readable without the full log.
      - name: Report compiler errors
        if: failure()
        run: |
          grep -hE "error:" xcodebuild-simulator.log xcodebuild-device.log 2>/dev/null \
            | sort -u | head -20 | sed 's/^/::error::/' || true

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          ditto \
            DeviceDerivedData/Build/Products/Release-iphoneos/Apple\ Videos.app \
            Payload/Apple\ Videos.app
          zip -qry AppleVideos-unsigned.ipa Payload

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppleVideos-iPhone
          path: |
            AppleVideos-unsigned.ipa
            xcodebuild-simulator.log
            xcodebuild-device.log
          if-no-files-found: warn
          retention-days: 14
