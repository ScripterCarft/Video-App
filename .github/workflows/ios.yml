name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Apple Videos
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project AppleVideos.xcodeproj \
            -scheme AppleVideos \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project AppleVideos.xcodeproj \
            -scheme AppleVideos \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild-device.log

      - name: Package simulator app
        if: success()
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            DerivedData/Build/Products/Debug-iphonesimulator/Apple\ Videos.app \
            AppleVideos-simulator.zip

      - name: Package unsigned IPA
        if: success()
        run: |
          mkdir -p Payload
          ditto \
            DeviceDerivedData/Build/Products/Release-iphoneos/Apple\ Videos.app \
            Payload/Apple\ Videos.app
          zip -qry AppleVideos-unsigned.ipa Payload

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AppleVideos-simulator
          path: |
            AppleVideos-simulator.zip
            AppleVideos-unsigned.ipa
            xcodebuild.log
            xcodebuild-device.log
          if-no-files-found: warn
          retention-days: 14
