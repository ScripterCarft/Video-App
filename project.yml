name: AppleVideos
options:
  bundleIdPrefix: com.scriptercarft
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  AppleVideos:
    type: application
    platform: iOS
    sources:
      - path: AppleVideos
    info:
      path: AppleVideos/Resources/Info.plist
      properties:
        CFBundleDisplayName: Videos
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scriptercarft.AppleVideos
        PRODUCT_NAME: Apple Videos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - AppleVideosTests
  AppleVideosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppleVideosTests
    dependencies:
      - target: AppleVideos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scriptercarft.AppleVideosTests
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"

